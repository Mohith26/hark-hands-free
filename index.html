<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hark · Hands-free (concept)</title>
<meta name="description" content="Unofficial concept demo: Hark certifies which kinds of Handoff errands can run without a confirmation, with a statistical guarantee on mistakes, and pauses them when a site changes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<div class="sky" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="haze"></div></div>

<header class="topbar">

    <button class="on">Home</button><button>Chat</button><button>Projects</button>

  <div class="tb-right">

  <footer class="foot">Unofficial concept demo by Mohith Gajjela. Not affiliated with Hark. Synthetic data. <a href="https://github.com/Mohith26/hark-hands-free">Source</a></footer>
